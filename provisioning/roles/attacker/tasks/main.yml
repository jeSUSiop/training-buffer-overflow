---
# Attacker role
# Prepares the student's attack box: the tools needed to craft shellcode and
# exploits, plus the attack-side lab files (attack-code/ and shellcode/).
# Note: server-code/ is deliberately NOT shipped here, so the Level-2 buffer
# size stays unknown to the student.

- name: Install attack tooling (netcat, python3, 32-bit build support)
  apt:
    name:
      - build-essential
      - gcc-multilib
      - python3
      - netcat-traditional
      - gdb
    state: present
    update_cache: yes

- name: Deploy the shellcode lab files
  copy:
    src: shellcode/
    dest: /home/user/shellcode/
    owner: user
    group: user
    mode: preserve

- name: Deploy the exploit skeleton and helper scripts
  copy:
    src: attack-code/
    dest: /home/user/attack-code/
    owner: user
    group: user
    mode: preserve

# ---------------------------------------------------------------------------
# Task 1 flag keeper (unique per sandbox)
#
# The Task 1 flag is the name of a group whose only member is the dedicated
# account `flagkeeper1` (it is flagkeeper1's primary group). The shellcode
# runner (call_shellcode.c -> a32.out) is installed setuid-root; on startup it
# calls initgroups("flagkeeper1"), which loads that group as a supplementary
# group, then drops back to the normal user before running the injected
# command. So the group shows up in `id` only when `id` is launched *through
# the shellcode*. Typing `id` in your own shell does not reveal it (you are not
# a member), so the only way to read it is to make the shellcode run `id` --
# which is the whole point of Task 1.
# ---------------------------------------------------------------------------
- name: Generate the unique Task 1 flag (group name) for this sandbox
  set_fact:
    flag_task1: "flag-t1-{{ lookup('password', '/dev/null chars=hexdigits length=12') | lower }}"

- name: Create the Task 1 flag group (the student is deliberately NOT a member)
  group:
    name: "{{ flag_task1 }}"
    state: present

- name: Create the dedicated flag-keeper account (its primary group is the flag)
  user:
    name: flagkeeper1
    group: "{{ flag_task1 }}"
    system: yes
    shell: /usr/sbin/nologin
    create_home: no
    password: '!'
    password_lock: yes
    state: present

- name: Pre-build the 32-bit shellcode runner (a32.out) as the student user
  command: make
  args:
    chdir: /home/user/shellcode
    creates: /home/user/shellcode/a32.out
  become: true
  become_user: user

- name: Install the 32-bit shellcode runner setuid-root (Task 1 flag keeper)
  file:
    path: /home/user/shellcode/a32.out
    owner: root
    group: root
    mode: '4755'

# The generated flag is recorded so the training definition can validate each
# student's submission against their own sandbox value (variant answers).
- name: Record the generated Task 1 flag for the training definition
  copy:
    dest: /root/training-answers.yml
    content: |
      flag_task1: "{{ flag_task1 }}"
    owner: root
    group: root
    mode: '0600'
