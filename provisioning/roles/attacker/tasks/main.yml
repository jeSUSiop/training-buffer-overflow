---
# Attacker role
# Prepares the student's attack box: the tools needed to craft shellcode and
# exploits, plus the attack-side lab files (attack-code/ and shellcode/).
# Note: server-code/ is deliberately NOT shipped here, so the Level-2 buffer
# size stays unknown to the student.

- name: Install attack tooling (netcat, python3, 32-bit build support)
  apt:
    name:
      - build-essential
      - gcc-multilib
      - python3
      - netcat-traditional
      - gdb
    state: present
    update_cache: yes

- name: Deploy the shellcode lab files
  copy:
    src: shellcode/
    dest: /home/user/shellcode/
    owner: user
    group: user
    mode: preserve

- name: Deploy the exploit skeleton and helper scripts
  copy:
    src: attack-code/
    dest: /home/user/attack-code/
    owner: user
    group: user
    mode: preserve
