name: training-buffer-overflow

hosts:
  - name: attacker
    base_box:
      image: seed
      mgmt_user: seed
    flavor: m1.medium

  - name: server
    base_box:
      image: seed
      mgmt_user: seed
    flavor: m1.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: lab-switch
    cidr: 10.1.26.0/24

net_mappings:
  - host: attacker
    network: lab-switch
    ip: 10.1.26.23

  - host: server
    network: lab-switch
    ip: 10.1.26.9

router_mappings:
  - router: router
    network: lab-switch
    ip: 10.1.26.1

groups: []
